<style>
:root{--hairline:.5px}
:root{--font-mono:var(--font-sans) !important}
html,body{margin:0;background:var(--surface-page);color:var(--text-body);overflow-x:clip}
a{color:var(--link);text-decoration:none}
a:hover{color:var(--link-hover)}
.am-iconbtn{display:inline-flex;align-items:center;justify-content:center}
.sc-host-x:has(> .am-iconbtn){display:flex;align-items:center;justify-content:center}
.sc-host-x > .am-iconbtn{width:34px;height:34px;flex:none}
[style*="width:44px;height:44px;flex:none"] .am-iconbtn{width:34px !important;height:34px !important}
.am-iconbtn{transition:background-color 160ms,color 160ms,border-color 160ms,transform 160ms}
.am-iconbtn:active{transform:scale(.88)}
::view-transition-old(root),::view-transition-new(root){animation-duration:380ms;animation-timing-function:cubic-bezier(.22,1,.36,1)}
[data-lang-slot]>*{display:flex;width:100%;height:100%}
[data-lang-slot] .am-btn{width:100%;height:100%}
@media (max-width:899px){[data-fit]{white-space:nowrap}}
@media (max-width:899px){#nf-top h1{font-size:30px !important;line-height:1.15 !important}#nf-top [data-big]{font-size:112px !important}}
.am-iconbtn .am-icon{transition:transform 200ms cubic-bezier(.22,1,.36,1)}
.am-back{transition:color 120ms cubic-bezier(.22,1,.36,1)}
.am-back .am-icon{transition:transform 200ms cubic-bezier(.22,1,.36,1)}
.am-back:hover{color:var(--text-strong) !important}
.am-back:hover .am-icon{transform:translateX(-3px)}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}

.am-btn--lg{height:36px !important}

@media (max-width:899px){body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:110px;z-index:19;pointer-events:none;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);-webkit-mask-image:linear-gradient(to bottom,transparent,#000 70%);mask-image:linear-gradient(to bottom,transparent,#000 70%)}}

.am-btn:not(.am-btn--ghost):not(.am-btn--primary){border:var(--hairline) solid rgba(255,255,255,.1);background:#202020;border-radius:9px;color:#F2F2F2;font-weight:600}
.am-btn:not(.am-btn--ghost):not(.am-btn--primary) .am-icon{color:var(--text-muted)}
.am-btn:not(.am-btn--ghost):not(.am-btn--primary):hover{background:#292929;border-color:rgba(255,255,255,.16);color:#fff}
.am-btn:not(.am-btn--ghost):not(.am-btn--primary):hover .am-icon{color:var(--text-strong)}
html[style*="color-scheme: light"] .am-btn:not(.am-btn--ghost):not(.am-btn--primary){background:#FFFFFF;border-color:rgba(0,0,0,.12);color:#111;box-shadow:none}
html[style*="color-scheme: light"] .am-btn:not(.am-btn--ghost):not(.am-btn--primary):hover{background:#F5F5F5;border-color:rgba(0,0,0,.2);color:#000}
</style>
</helmet>

<div style="min-height:100vh;background:var(--surface-page);color:var(--text-body);font:var(--type-body);letter-spacing:var(--ls-body)">

    </div>

  <sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:4px;padding:4px;border-radius:var(--radius-full);border:var(--hairline) solid var(--border-default);background:var(--surface-overlay);backdrop-filter:var(--blur-glass);-webkit-backdrop-filter:var(--blur-glass);box-shadow:0 4px 12px rgba(0,0,0,.28)">
      <div role="group" aria-label="Language" ref="{{ setHGroup }}" style="position:relative;display:flex;gap:2px">
        <span aria-hidden="true" style="position:absolute;left:0;top:0;box-sizing:border-box;background:var(--surface-raised);border:var(--hairline) solid var(--border-default);box-shadow:var(--inset-highlight);transition:transform 420ms cubic-bezier(.22,1,.36,1), border-radius 420ms cubic-bezier(.22,1,.36,1);width:{{ hInd.w }};height:{{ hInd.h }};transform:{{ hInd.tr }};border-radius:{{ hIndRadius }}"></span>
        <sc-for list="{{ langs }}" as="l" hint-placeholder-count="3">

            <x-import component-from-global-scope="AleksandrMeEnnIDesignSystem_ba8917.Button" variant="ghost" size="sm" block="{{ true }}" on-click="{{ l.pick }}" aria-pressed="{{ l.on }}" style="width:100%;min-width:0;height:44px;padding:0;justify-content:center;border-radius:var(--radius-full);background:transparent;transition:color 120ms;color:{{ l.color }}" hint-size="48px,44px">{{ l.label }}</x-import>
          </div>

      </div>
      <span style="width:1px;height:18px;background:var(--border-default)"></span>
      <div style="display:flex;align-items:center;justify-content:center;width:44px;height:44px;flex:none">
        <x-import component-from-global-scope="AleksandrMeEnnIDesignSystem_ba8917.IconButton" icon="house" label="{{ t.navHome }}" data-nav="1" on-click="{{ goHome }}" style="width:44px;height:44px" hint-size="34px,34px"></x-import>
      </div>
      <div style="display:flex;align-items:center;justify-content:center;width:44px;height:44px;flex:none">
        <x-import component-from-global-scope="AleksandrMeEnnIDesignSystem_ba8917.IconButton" icon="user" label="{{ t.navAbout }}" data-nav="1" on-click="{{ goAbout }}" style="width:44px;height:44px" hint-size="34px,34px"></x-import>
      </div>
      <div style="display:flex;align-items:center;justify-content:center;width:44px;height:44px;flex:none">
        <x-import component-from-global-scope="AleksandrMeEnnIDesignSystem_ba8917.IconButton" icon="file-text" label="CV" data-nav="1" on-click="{{ goCv }}" style="width:44px;height:44px" hint-size="34px,34px"></x-import>
      </div>
      <div style="display:flex;align-items:center;justify-content:center;width:44px;height:44px;flex:none">
        <x-import component-from-global-scope="AleksandrMeEnnIDesignSystem_ba8917.IconButton" icon="{{ themeIcon }}" label="{{ themeLabel }}" data-theme-btn="1" on-click="{{ toggleTheme }}" style="width:44px;height:44px" hint-size="34px,34px"></x-import>
      </div>
    </div>
  </sc-if>

  <main id="nf-top" style="max-width:var(--container);min-height:100vh;margin:0 auto;padding:0 20px;padding-top:{{ padT }};padding-bottom:{{ padB }};box-sizing:border-box;display:flex;flex-direction:column">
    <div style="flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:48px">
      <div style="font-family:var(--font-serif);font-size:15px;font-style:italic;color:var(--text-subtle)">{{ t.code }}</div>
      <div data-big="1" aria-hidden="true" style="margin-top:4px;font-family:var(--font-serif);font-weight:400;font-size:168px;line-height:.9;letter-spacing:-0.04em;color:var(--text-strong)">404</div>
      <h1 style="margin:32px 0 0;font:var(--type-display);letter-spacing:var(--ls-display);color:var(--text-strong);text-wrap:balance">

        <span style="display:block;margin-top:4px;color:var(--text-subtle)">{{ t.h1b }}</span>
      </h1>
      <p style="margin:24px 0 0;max-width:52ch;color:var(--text-muted);text-wrap:pretty">{{ t.p1 }}</p>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:32px">
        <x-import component-from-global-scope="AleksandrMeEnnIDesignSystem_ba8917.Button" variant="secondary" size="lg" icon="house" href="./" hint-size="150px,42px">{{ t.home }}</x-import>
        <x-import component-from-global-scope="AleksandrMeEnnIDesignSystem_ba8917.Button" variant="ghost" size="lg" icon="user" href="about/" hint-size="110px,42px">{{ t.navAbout }}</x-import>
        <x-import component-from-global-scope="AleksandrMeEnnIDesignSystem_ba8917.Button" variant="ghost" size="lg" icon="file-text" href="cv/" hint-size="70px,42px">CV</x-import>

    <footer style="padding-top:20px;border-top:var(--hairline) solid var(--border-subtle);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;font:var(--type-meta);color:var(--text-subtle)">
      <span>© {{ curYear }} Aleksandr Mežennõi</span>
      <a href="secret/" aria-label="=)" style="color:inherit">=)</a>
    </footer>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const I18N = {
  en: {
    navHome: 'Portfolio', navAbout: 'About me', light: 'Light theme', dark: 'Dark theme',
    code: 'Error', h1a: "This page doesn't exist.", h1b: 'No need to poke around here.',
    p1: 'The link may be outdated or the page has moved. Everything else is right where it should be.',
    home: 'Back to portfolio'
  },
  ru: {
    navHome: 'Портфолио', navAbout: 'Обо мне', light: 'Светлая тема', dark: 'Тёмная тема',
    code: 'Ошибка', h1a: 'Такой страницы нет.', h1b: 'Не нужно тут ковыряться.',
    p1: 'Возможно, ссылка устарела или страница переехала. Всё остальное на месте.',
    home: 'На главную'
  },
  et: {
    navHome: 'Portfoolio', navAbout: 'Minust', light: 'Hele teema', dark: 'Tume teema',
    code: 'Viga', h1a: 'Sellist lehte pole.', h1b: 'Siin pole vaja sorida.',
    p1: 'Link võib olla aegunud või leht on kolinud. Kõik muu on omal kohal.',
    home: 'Avalehele'
  }
};
const LANGS = [['en', 'ENG'], ['et', 'EST'], ['ru', 'RUS']];
const LIGHT = {
  '--surface-page': '#F2F2F2', '--surface-sunken': '#EDEDED', '--surface-card': '#FFFFFF', '--surface-raised': '#F7F7F7', '--surface-hover': '#EDEDED',
  '--surface-inverse': '#0F0F0F', '--surface-overlay': 'rgba(242,242,242,.78)',
  '--text-strong': '#0A0A0A', '--text-body': '#1A1A1A', '--text-muted': '#4A4A4A', '--text-subtle': '#6B6B6B', '--text-disabled': '#A3A3A3', '--text-inverse': '#FFFFFF',
  '--border-subtle': 'rgba(0,0,0,.08)', '--border-default': 'rgba(0,0,0,.12)', '--border-strong': 'rgba(0,0,0,.22)', '--border-focus': 'rgba(0,0,0,.55)',
  '--gray-200': '#2E2E2E', '--gray-750': '#E3E3E3', '--signal-live': '#15803D', '--signal-live-dim': 'rgba(21,128,61,.12)',
  '--inset-highlight': 'none', '--shadow-md': '0 4px 16px rgba(0,0,0,.08)', '--shadow-lg': '0 16px 48px rgba(0,0,0,.14)', '--link': '#0A0A0A', '--link-hover': '#4A4A4A'
};

class Component extends DCLogic {
  state = {
    lang: (() => { try { return localStorage.getItem('am_lang') || 'en'; } catch (e) { return 'en'; } })(),
    theme: (() => { try { return localStorage.getItem('am_theme') || 'dark'; } catch (e) { return 'dark'; } })(),
    mobile: typeof window !== 'undefined' && window.innerWidth < 900
  };
  componentDidMount() {
    this.applyTheme(); this.applyLang();
    this.onResize = () => { const m = window.innerWidth < 900; if (m !== this.state.mobile) this.setState({ mobile: m }); };
    window.addEventListener('resize', this.onResize);
    this.fitFn = () => requestAnimationFrame(() => this.fitText());
    window.addEventListener('resize', this.fitFn); this.fitFn(); document.fonts && document.fonts.ready.then(this.fitFn);
  }
  componentWillUnmount() { window.removeEventListener('resize', this.onResize); window.removeEventListener('resize', this.fitFn); }
  fmt() {
    try {
      const d = new Date();
      const time = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Tallinn', hour: '2-digit', minute: '2-digit', hour12: false }).format(d);
      const tz = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Tallinn', timeZoneName: 'shortOffset' }).formatToParts(d).find(p => p.type === 'timeZoneName');
      return time + ' · ' + (tz ? tz.value.replace('GMT', 'UTC') : 'EET');
    } catch (e) { return ''; }
  }
  fitText() {
    document.querySelectorAll('[data-fit]').forEach(el => {
      el.style.fontSize = '';
      if (window.innerWidth >= 900) return;
      const avail = el.parentElement.clientWidth, base = parseFloat(getComputedStyle(el).fontSize);
      el.style.fontSize = '100px'; const w = el.scrollWidth; el.style.fontSize = '';
      const size = avail && w ? Math.floor(100 * avail / w * 0.98 * 10) / 10 : base;
      if (size < base) el.style.fontSize = size + 'px';
    });
  }
  applyTheme(th = this.state.theme) {
    const s = document.documentElement.style;
    for (const k in LIGHT) th === 'light' ? s.setProperty(k, LIGHT[k]) : s.removeProperty(k);
    document.documentElement.style.colorScheme = th;
    try { localStorage.setItem('am_theme', th); } catch (e) {}
  }
  applyLang() {
    requestAnimationFrame(() => this.measureInd());
    if (this.fitFn) this.fitFn();
    document.documentElement.lang = this.state.lang;
    try { localStorage.setItem('am_lang', this.state.lang); } catch (e) {}
  }
  watchGroup(key, el) {
    const ro = key + 'RO';
    if (this[ro]) { this[ro].disconnect(); this[ro] = null; }
    this[key + 'El'] = el;
    if (el && window.ResizeObserver) {
      this[ro] = new ResizeObserver(() => this.measureInd()); this[ro].observe(el);
      new MutationObserver(() => { el.querySelectorAll('[data-lang-slot]').forEach(s => this[ro] && this[ro].observe(s)); this.measureInd(); }).observe(el, { childList: true, subtree: true });
    }
    if (el) { requestAnimationFrame(() => this.measureInd()); document.fonts && document.fonts.ready.then(() => this.measureInd()); }
  }
  setVGroup = el => { if (el !== this.vEl) this.watchGroup('v', el); };
  setHGroup = el => { if (el !== this.hEl) this.watchGroup('h', el); };
  measureInd() {
    const i = Math.max(0, LANGS.findIndex(([c]) => c === this.state.lang)), next = {};
    for (const k of ['v', 'h']) {
      const g = this[k + 'El']; if (!g) continue;
      const b = g.querySelectorAll('[data-lang-slot]')[i]; if (!b) continue;
      const gr = g.getBoundingClientRect(), r = b.getBoundingClientRect();
      const ext = k === 'v' && i === 0 ? 10 : 0, s = 2;
      const val = { w: (r.width - s * 2) + 'px', h: (r.height + ext - s * 2) + 'px', tr: `translate(${r.left - gr.left + s}px, ${r.top - gr.top - ext + s}px)` };
      const cur = this.state[k + 'Ind'];
      if (!cur || cur.w !== val.w || cur.h !== val.h || cur.tr !== val.tr) next[k + 'Ind'] = val;
    }
    if (Object.keys(next).length) this.setState(next);
  }
  renderVals() {
    const { lang, theme, mobile } = this.state;
    const T = I18N[lang] || I18N.en;
    const i = Math.max(0, LANGS.findIndex(([c]) => c === lang)), last = i === LANGS.length - 1;
    return {
      curYear: new Date().getFullYear(),
      goHome: () => { window.location.href = './'; },
      goCv: () => { window.location.href = 'cv/'; },
      goAbout: () => { window.location.href = 'about/'; },
      goTop: () => window.scrollTo({ top: 0, behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }),
      t: T, mobile, desktop: !mobile, tallinnTime: this.state.tl || this.fmt(), padT: mobile ? '48px' : '64px', padB: mobile ? '96px' : '32px',
      vInd: this.state.vInd || { w: '0px', h: '0px', tr: 'none' }, hInd: this.state.hInd || { w: '0px', h: '0px', tr: 'none' },
      vIndRadius: i === 0 ? '20px 20px 7px 7px' : '7px', hIndRadius: i === 0 ? '22px 6px 6px 22px' : last ? '6px 22px 22px 6px' : '6px',
      setVGroup: this.setVGroup, setHGroup: this.setHGroup,
      langs: LANGS.map(([code, label]) => ({ label, on: code === lang, color: code === lang ? 'var(--text-strong)' : 'var(--text-subtle)', pick: () => this.setState({ lang: code }, () => this.applyLang()) })),
      themeIcon: theme === 'dark' ? 'sun' : 'moon', themeLabel: theme === 'dark' ? T.light : T.dark,
      toggleTheme: () => {
        const next = theme === 'dark' ? 'light' : 'dark';
        const run = () => this.applyTheme(next);
        if (document.startViewTransition && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) document.startViewTransition(run); else run();
        this.setState({ theme: next });
      }
    };
  }
}
</script>
</body>
